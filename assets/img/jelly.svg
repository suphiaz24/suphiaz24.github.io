<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64">
  <!-- Purple moon jellyfish. Tiles vertically; the button drifts the tile upward, and each bell pulses here. -->
  <style>
    .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
    .sway { animation: sway 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
    .pulse, .sway { animation-delay: var(--d, 0s); }
    .d1 { --d: -.6s; } .d2 { --d: -1.3s; } .d3 { --d: -2s; }
    @keyframes pulse { 0%, 100% { transform: scale(1, 1); } 40% { transform: scale(.86, 1.12); } }
    @keyframes sway { 0%, 100% { transform: skewX(6deg) scaleY(1); } 50% { transform: skewX(-6deg) scaleY(.9); } }
    @media (prefers-reduced-motion: reduce) { .pulse, .sway { animation: none; } }
  </style>
  <defs>
    <radialGradient id="bell" cx="50%" cy="85%" r="80%">
      <stop offset="0" stop-color="#f3ecff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#c8b2ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#9a7bf0" stop-opacity=".55"/>
    </radialGradient>
    <g id="jf">
      <!-- trailing tentacles and frilled oral arms -->
      <g class="sway" fill="none" stroke-linecap="round">
        <path d="M-10 1c-1 5 1 9-1 14M-5 2c1 6-1 11 1 17M5 2c-1 6 1 11-1 17M10 1c1 5-1 9 1 14" stroke="#d9cbff" stroke-width=".7" opacity=".7"/>
        <path d="M-2 2c-2 5 2 9 0 14M2 2c2 5-2 9 0 14" stroke="#b79cff" stroke-width="1.6" opacity=".75"/>
      </g>
      <!-- bell with scalloped margin and the four violet gonad rings of a moon jelly -->
      <g class="pulse">
        <path d="M-13 1C-13-13 13-13 13 1Q9.75 3.2 6.5 1Q3.25 3.2 0 1Q-3.25 3.2-6.5 1Q-9.75 3.2-13 1Z" fill="url(#bell)" stroke="#efe6ff" stroke-width=".6" stroke-opacity=".8"/>
        <g fill="none" stroke="#7c4dff" stroke-width="1.3" opacity=".9">
          <circle cx="-4.2" cy="-5.5" r="2.4"/><circle cx="4.2" cy="-5.5" r="2.4"/><circle cx="-2" cy="-2.2" r="2.1"/><circle cx="2" cy="-2.2" r="2.1"/>
        </g>
        <ellipse cx="-4" cy="-8" rx="4" ry="1.6" fill="#fff" opacity=".45"/>
      </g>
    </g>
  </defs>
  <use href="#jf" transform="translate(28 20) scale(1.05)" opacity=".85"/>
  <use href="#jf" transform="translate(96 46) scale(.75)" opacity=".7" class="d1"/>
  <use href="#jf" transform="translate(160 18) scale(.9)" opacity=".8" class="d2"/>
  <use href="#jf" transform="translate(222 50) scale(1.1)" opacity=".75" class="d3"/>
  <use href="#jf" transform="translate(222 -14) scale(1.1)" opacity=".75" class="d3"/>
  <use href="#jf" transform="translate(278 22) scale(.65)" opacity=".7" class="d1"/>
  <use href="#jf" transform="translate(58 58) scale(.5)" opacity=".6" class="d2"/>
  <use href="#jf" transform="translate(58 -6) scale(.5)" opacity=".6" class="d2"/>
  <use href="#jf" transform="translate(128 6) scale(.45)" opacity=".6"/>
  <g fill="#ffffff" opacity=".55">
    <circle cx="74" cy="12" r="1"/><circle cx="190" cy="40" r="1.1"/><circle cx="252" cy="8" r=".9"/><circle cx="12" cy="48" r=".9"/><circle cx="140" cy="54" r="1"/>
  </g>
</svg>
